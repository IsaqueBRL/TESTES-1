<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa e Edição de Produtos - Deuris Candy 2</title>
    <style>
        :root {
            --primary-color: #714B67;
            --primary-hover: #5a3b52;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
            --success-color: #2e7d32;
            --danger-color: #c62828;
            --edit-color: #1976d2;
            --edit-hover: #115293;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 25px; }
        header h1 { color: var(--primary-color); font-size: 28px; margin-bottom: 8px; }
        header p { color: #666; font-size: 14px; }

        .search-box { display: flex; gap: 10px; margin-bottom: 20px; background: var(--card-bg); padding: 12px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .search-box input { flex: 1; padding: 12px 16px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 16px; outline: none; transition: border-color 0.2s; }
        .search-box input:focus { border-color: var(--primary-color); }
        .search-box button { padding: 12px 24px; background-color: var(--primary-color); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 600; transition: background 0.2s; }
        .search-box button:hover { background-color: var(--primary-hover); }

        .status { text-align: center; margin-bottom: 20px; font-size: 15px; color: #555; font-weight: 500; }

        .table-container { background: var(--card-bg); border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background-color: var(--primary-color); color: white; font-weight: 600; padding: 14px 18px; font-size: 15px; white-space: nowrap; }
        td { padding: 14px 18px; border-bottom: 1px solid var(--border-color); font-size: 15px; }
        tr:hover { background-color: #f8f9fa; }
        
        .price-col { font-weight: 600; color: #222; }
        .cost-col { color: #666; font-weight: 500; }
        
        .stock-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 13px; font-weight: 600; }
        .stock-in { background-color: #e8f5e9; color: var(--success-color); }
        .stock-out { background-color: #ffebee; color: var(--danger-color); }

        .btn-edit { background-color: var(--edit-color); color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
        .btn-edit:hover { background-color: var(--edit-hover); }

        /* Estilos do Modal de Edição */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: white; padding: 25px; border-radius: 12px; width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); }
        .modal h2 { color: var(--primary-color); font-size: 20px; }
        .modal label { font-size: 13px; font-weight: 600; color: #555; margin-bottom: -10px; }
        .modal input { padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 15px; outline: none; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
        .btn-cancel { background-color: #777; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn-save { background-color: var(--primary-color); color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn-save:hover { background-color: var(--primary-hover); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Consulta e Edição de Produtos</h1>
        <p>Deuris Candy 2</p>
    </header>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Digite o nome do produto..." oninput="debounceSearch()">
        <button onclick="buscarProdutos()">Pesquisar</button>
    </div>

    <div id="status" class="status">Digite um termo para pesquisar os produtos.</div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>DESCRIÇÃO</th>
                    <th>PREÇO VENDA</th>
                    <th>CUSTO</th>
                    <th>ESTOQUE</th>
                    <th>AÇÕES</th>
                </tr>
            </thead>
            <tbody id="results">
                <!-- Linhas dos produtos serão carregadas aqui -->
            </tbody>
        </table>
    </div>
</div>

<!-- Modal de Edição -->
<div class="modal-overlay" id="editModal">
    <div class="modal">
        <h2>Editar Produto</h2>
        <input type="hidden" id="editId">
        
        <label>Nome do Produto</label>
        <input type="text" id="editName">

        <label>Preço de Venda (R$)</label>
        <input type="number" step="0.01" id="editPrice">

        <label>Preço de Custo (R$)</label>
        <input type="number" step="0.01" id="editCost">

        <label>Senha de Confirmação</label>
        <input type="password" id="editPassword" placeholder="Digite '123456'">

        <div class="modal-actions">
            <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
            <button class="btn-save" onclick="salvarAlteracao()">Salvar no Odoo</button>
        </div>
    </div>
</div>

<script>
    let timer = null;
    let produtosCarregados = [];

    function debounceSearch() {
        clearTimeout(timer);
        timer = setTimeout(() => {
            buscarProdutos();
        }, 300);
    }

    async function buscarProdutos() {
        const query = document.getElementById("searchInput").value.trim();
        const status = document.getElementById("status");
        const results = document.getElementById("results");

        status.innerText = "A pesquisar produtos...";
        results.innerHTML = "";

        try {
            const response = await fetch('/api/odoo', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: "search", query })
            });

            const data = await response.json();

            if (!data.result || data.result.length === 0) {
                status.innerText = "Nenhum produto encontrado.";
                results.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #888;">Nenhum produto encontrado</td></tr>`;
                return;
            }

            produtosCarregados = data.result;
            status.innerText = `${data.result.length} produto(s) encontrado(s):`;

            data.result.forEach(prod => {
                const stock = prod.qty_available ?? 0;
                const price = prod.list_price ?? 0;
                const cost = prod.standard_price ?? 0;
                const hasStock = stock > 0;

                results.innerHTML += `
                    <tr>
                        <td><strong>${prod.name}</strong></td>
                        <td class="price-col">R$ ${price.toFixed(2)}</td>
                        <td class="cost-col">R$ ${cost.toFixed(2)}</td>
                        <td>
                            <span class="stock-badge ${hasStock ? 'stock-in' : 'stock-out'}">
                                ${hasStock ? `${stock} un` : 'Esgotado'}
                            </span>
                        </td>
                        <td>
                            <button class="btn-edit" onclick="abrirModal(${prod.id})">Editar</button>
                        </td>
                    </tr>
                `;
            });
        } catch (e) {
            status.innerText = "Erro ao carregar produtos. Tente novamente.";
            results.innerHTML = `<tr><td colspan="5" style="text-align: center; color: red;">Erro ao carregar dados</td></tr>`;
        }
    }

    function abrirModal(id) {
        const prod = produtosCarregados.find(p => p.id === id);
        if (!prod) return;

        document.getElementById('editId').value = prod.id;
        document.getElementById('editName').value = prod.name;
        document.getElementById('editPrice').value = prod.list_price;
        document.getElementById('editCost').value = prod.standard_price;
        document.getElementById('editPassword').value = '';
        document.getElementById('editModal').style.display = 'flex';
    }

    function fecharModal() {
        document.getElementById('editModal').style.display = 'none';
    }

    async function salvarAlteracao() {
        const id = document.getElementById('editId').value;
        const name = document.getElementById('editName').value;
        const list_price = document.getElementById('editPrice').value;
        const standard_price = document.getElementById('editCost').value;
        const password = document.getElementById('editPassword').value;

        if (!password) {
            alert('Por favor, digite a senha de confirmação.');
            return;
        }

        try {
            const response = await fetch('/api/odoo', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'update',
                    id, name, list_price, standard_price, password
                })
            });

            const data = await response.json();
            if (data.error) {
                alert(`Erro: ${data.error}`);
            } else {
                alert('Produto atualizado com sucesso no Odoo!');
                fecharModal();
                buscarProdutos();
            }
        } catch (err) {
            alert('Erro ao conectar com o servidor para atualizar.');
        }
    }

    window.onload = buscarProdutos;
</script>

</body>
</html>
