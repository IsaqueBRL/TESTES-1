<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta e Edição de Produtos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #f4f5f8; color: #333; display: flex; justify-content: center; padding: 40px 20px; }
        .container { width: 100%; max-width: 950px; background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { text-align: center; color: #6a395b; font-size: 28px; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 25px; }
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"], input[type="number"], input[type="password"] { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; outline: none; }
        button { padding: 12px 20px; background-color: #6a395b; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #522b46; }
        .btn-edit { background-color: #2196F3; padding: 6px 12px; font-size: 12px; }
        .btn-edit:hover { background-color: #0b7dda; }
        .info-count { text-align: center; margin-bottom: 15px; font-size: 14px; color: #555; font-weight: 600; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background-color: #6a395b; color: white; padding: 14px 16px; text-align: left; font-size: 13px; text-transform: uppercase; }
        td { padding: 14px 16px; border-bottom: 1px solid #eee; font-size: 14px; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .badge-success { background-color: #e6f4ea; color: #137333; }
        .badge-danger { background-color: #fce8e6; color: #c5221f; }
        .empty-message { text-align: center; padding: 30px; color: #777; }

        /* Estilos do Modal de Edição */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal { background: white; padding: 25px; border-radius: 12px; width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; }
        .modal h2 { color: #6a395b; font-size: 20px; }
        .modal label { font-size: 12px; font-weight: bold; color: #555; margin-bottom: -10px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
        .btn-cancel { background-color: #888; }
    </style>
</head>
<body>

<div class="container">
    <h1>Consulta e Edição de Produtos</h1>
    <div class="subtitle">Deuris Candy 2</div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Digite o nome do produto..." onkeyup="if(event.key === 'Enter') buscarProdutos()">
        <button onclick="buscarProdutos()">Pesquisar</button>
    </div>

    <div id="countContainer" class="info-count"></div>

    <table>
        <thead>
            <tr>
                <th>Descrição</th>
                <th>Preço Venda</th>
                <th>Custo</th>
                <th>Estoque</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr><td colspan="5" class="empty-message">Carregando produtos...</td></tr>
        </tbody>
    </table>
</div>

<!-- Modal de Edição -->
<div class="modal-overlay" id="editModal">
    <div class="modal">
        <h2>Editar Produto</h2>
        <input type="hidden" id="editId">
        
        <label>Nome do Produto</label>
        <input type="text" id="editName">

        <label>Preço de Venda (R$)</label>
        <input type="number" step="0.01" id="editPrice">

        <label>Preço de Custo (R$)</label>
        <input type="number" step="0.01" id="editCost">

        <label>Senha de Confirmação</label>
        <input type="password" id="editPassword" placeholder="Digite '123456'">

        <div class="modal-actions">
            <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
            <button onclick="salvarAlteracao()">Salvar no Odoo</button>
        </div>
    </div>
</div>

<script>
    let produtosCarregados = [];

    async function buscarProdutos() {
        const query = document.getElementById('searchInput').value;
        const tableBody = document.getElementById('tableBody');
        const countContainer = document.getElementById('countContainer');

        tableBody.innerHTML = '<tr><td colspan="5" class="empty-message">Buscando...</td></tr>';
        countContainer.innerText = '';

        try {
            const response = await fetch('/api/odoo', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: "search", query: query })
            });

            const data = await response.json();
            if (data.error) {
                tableBody.innerHTML = `<tr><td colspan="5" class="empty-message" style="color:red">Erro: ${data.error}</td></tr>`;
                return;
            }

            produtosCarregados = data.result || [];
            if (produtosCarregados.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="5" class="empty-message">Nenhum produto encontrado.</td></tr>';
                countContainer.innerText = '0 produto(s) encontrado(s)';
                return;
            }

            countContainer.innerText = `${produtosCarregados.length} produto(s) encontrado(s):`;
            tableBody.innerHTML = '';

            produtosCarregados.forEach(prod => {
                const preco = (prod.list_price || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                const custo = (prod.standard_price || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                const qtd = prod.qty_available || 0;
                const badge = qtd <= 0 ? `<span class="badge badge-danger">Esgotado</span>` : `<span class="badge badge-success">${qtd} un</span>`;

                const row = `
                    <tr>
                        <td><strong>${prod.name}</strong></td>
                        <td>${preco}</td>
                        <td>${custo}</td>
                        <td>${badge}</td>
                        <td><button class="btn-edit" onclick="abrirModal(${prod.id})">Editar</button></td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            });
        } catch (err) {
            tableBody.innerHTML = `<tr><td colspan="5" class="empty-message" style="color:red">Erro na conexão.</td></tr>`;
        }
    }

    function abrirModal(id) {
        const prod = produtosCarregados.find(p => p.id === id);
        if (!prod) return;

        document.getElementById('editId').value = prod.id;
        document.getElementById('editName').value = prod.name;
        document.getElementById('editPrice').value = prod.list_price;
        document.getElementById('editCost').value = prod.standard_price;
        document.getElementById('editPassword').value = '';
        document.getElementById('editModal').style.display = 'flex';
    }

    function fecharModal() {
        document.getElementById('editModal').style.display = 'none';
    }

    async function salvarAlteracao() {
        const id = document.getElementById('editId').value;
        const name = document.getElementById('editName').value;
        const list_price = document.getElementById('editPrice').value;
        const standard_price = document.getElementById('editCost').value;
        const password = document.getElementById('editPassword').value;

        if (!password) {
            alert('Por favor, digite a senha de confirmação.');
            return;
        }

        try {
            const response = await fetch('/api/odoo', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'update',
                    id, name, list_price, standard_price, password
                })
            });

            const data = await response.json();
            if (data.error) {
                alert(`Erro: ${data.error}`);
            } else {
                alert('Produto atualizado com sucesso no Odoo!');
                fecharModal();
                buscarProdutos(); // Recarrega a tabela
            }
        } catch (err) {
            alert('Erro ao conectar com o servidor para atualizar.');
        }
    }

    window.onload = buscarProdutos;
</script>

</body>
</html>
