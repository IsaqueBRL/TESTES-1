<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Pesquisa de Produtos - Odoo</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; }
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 15px; background: #714B67; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        .card { border: 1px solid #eee; padding: 10px; margin-top: 10px; border-radius: 4px; }
    </style>
</head>
<body>
<div class="container">
    <h2>Pesquisa de Produtos - Deuris Candy 2</h2>
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Nome do produto...">
        <button onclick="buscar()">Pesquisar</button>
    </div>
    <div id="status"></div>
    <div id="results"></div>
</div>

<script>
    async function buscar() {
        const query = document.getElementById("searchInput").value;
        const status = document.getElementById("status");
        const results = document.getElementById("results");
        
        status.innerText = "A carregar...";
        results.innerHTML = "";

        try {
            // Chama a Serverless Function que contorna o CORS
            const response = await fetch('/api/odoo', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query })
            });

            const data = await response.json();
            status.innerText = "";

            if (!data.result || data.result.length === 0) {
                status.innerText = "Nenhum produto encontrado.";
                return;
            }

            data.result.forEach(prod => {
                results.innerHTML += `
                    <div class="card">
                        <strong>${prod.name}</strong><br>
                        Preço: R$ ${prod.list_price.toFixed(2)} | Stock: ${prod.qty_available ?? 0}
                    </div>
                `;
            });
        } catch (e) {
            status.innerText = "Erro ao buscar produtos.";
        }
    }
</script>
</body>
</html>
