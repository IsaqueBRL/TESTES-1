<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Produtos</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f5f8;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #6a395b;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #6a395b;
        }

        button {
            padding: 12px 24px;
            background-color: #6a395b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #522b46;
        }

        .info-count {
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
            color: #555;
            font-weight: 600;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            overflow: hidden;
            border-radius: 8px;
        }

        th {
            background-color: #6a395b;
            color: white;
            text-align: left;
            padding: 14px 16px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:nth-child(even) {
            background-color: #fcfcfc;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-success {
            background-color: #e6f4ea;
            color: #137333;
        }

        .badge-danger {
            background-color: #fce8e6;
            color: #c5221f;
        }

        .badge-type {
            background-color: #f1f3f4;
            color: #3c4043;
            border: 1px solid #dadce0;
        }

        .empty-message {
            text-align: center;
            padding: 30px;
            color: #777;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Consulta de Produtos</h1>
    <div class="subtitle">Deuris Candy 2</div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Digite o nome do produto..." onkeyup="if(event.key === 'Enter') buscarProdutos()">
        <button onclick="buscarProdutos()">Pesquisar</button>
    </div>

    <div id="countContainer" class="info-count"></div>

    <table>
        <thead>
            <tr>
                <th>Descrição</th>
                <th>Tipo de Produto</th>
                <th>Preço Venda</th>
                <th>Custo</th>
                <th>Estoque</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr>
                <td colspan="5" class="empty-message">Carregando produtos...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    async function buscarProdutos() {
        const query = document.getElementById('searchInput').value;
        const tableBody = document.getElementById('tableBody');
        const countContainer = document.getElementById('countContainer');

        tableBody.innerHTML = '<tr><td colspan="5" class="empty-message">Buscando...</td></tr>';
        countContainer.innerText = '';

        try {
            const response = await fetch('/api/odoo', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query: query })
            });

            const data = await response.json();

            if (data.error) {
                tableBody.innerHTML = `<tr><td colspan="5" class="empty-message" style="color:red">Erro: ${data.error}</td></tr>`;
                return;
            }

            const produtos = data.result || [];

            if (produtos.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="5" class="empty-message">Nenhum produto encontrado.</td></tr>';
                countContainer.innerText = '0 produto(s) encontrado(s)';
                return;
            }

            countContainer.innerText = `${produtos.length} produto(s) encontrado(s):`;
            tableBody.innerHTML = '';

            produtos.forEach(prod => {
                const preco = (prod.list_price || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                const custo = (prod.standard_price || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                const qtd = prod.qty_available || 0;
                const tipo = prod.tipo_display || 'Mercadorias';

                let estoqueBadge = `<span class="badge badge-success">${qtd} un</span>`;
                if (qtd <= 0) {
                    estoqueBadge = `<span class="badge badge-danger">Esgotado</span>`;
                }

                const row = `
                    <tr>
                        <td><strong>${prod.name}</strong></td>
                        <td><span class="badge badge-type">${tipo}</span></td>
                        <td>${preco}</td>
                        <td>${custo}</td>
                        <td>${estoqueBadge}</td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            });

        } catch (err) {
            tableBody.innerHTML = `<tr><td colspan="5" class="empty-message" style="color:red">Erro ao conectar com o servidor.</td></tr>`;
        }
    }

    // Carrega automaticamente ao abrir a página
    window.onload = buscarProdutos;
</script>

</body>
</html>
